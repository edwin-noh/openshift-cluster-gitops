apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  # MaaS (components-aigateway-maas / gateway-maas / maas-postgres-cnpg) is left out:
  # its Gateway requires the `cert-manager-ingress-cert` secret in openshift-ingress,
  # which only exists on RHDP sandbox clusters. Dropping it also removes the
  # CloudNativePG / External Secrets / Kuadrant footprint, which this SNO does not need.
  - ../../components/components-aipipelines
  - ../../components/components-feast
  - ../../components/components-kserve
  - ../../components/components-kserve-wva
  - ../../components/components-kueue
  - ../../components/components-mlflow
  - ../../components/components-mlflow-basic-instance
  - ../../components/components-modelregistry
  - ../../components/components-observability
  - ../../components/components-ogx
  - ../../components/components-ray
  - ../../components/components-trainingoperator
  - ../../components/components-trustyai
  - ../../components/components-workbenches
  - ../../components/disable-amd-runtimes
  - ../../components/disable-gaudi-runtimes
  - ../../components/disable-ibm-runtimes
  - ../../components/gateway-inference
  - ../../components/hardware-profiles-nvidia-gpu
  - ../../components/idle-notebook-culling
  - ../../components/rhoai-auth
