apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  # Models-as-a-Service. Needs the redhat-connectivity-link operator (aggregate/overlays/maas)
  # and user-workload-monitoring. No MetalLB needed: gateway-maas exposes the gateway through
  # a ClusterIP Service + passthrough Route on the default router, TLS via router-certs-default.
  - ../../components/components-aigateway-maas
  - ../../components/gateway-maas
  - ../../components/maas-postgres
  - ../../components/components-aipipelines
  # - ../../components/components-feast
  - ../../components/components-kserve
  # - ../../components/components-kserve-wva
  - ../../components/components-kueue
  - ../../components/components-mlflow
  - ../../components/components-mlflow-basic-instance
  - ../../components/components-modelregistry
  - ../../components/components-observability
  - ../../components/components-ogx
  - ../../components/components-ray
  - ../../components/components-trainingoperator
  - ../../components/components-trustyai
  - ../../components/components-workbenches
  - ../../components/disable-amd-runtimes
  - ../../components/disable-gaudi-runtimes
  - ../../components/disable-ibm-runtimes
  # The inference Gateway needs a LoadBalancer Service, and MetalLB is disabled on
  # this SNO, so it would sit at EXTERNAL-IP <pending> forever. It only serves
  # llm-d/LLMInferenceService without MaaS; the dashboard, plain KServe and MaaS
  # (maas-default-gateway) use Routes. Re-enable together with MetalLB.
  # - ../../components/gateway-inference
  - ../../components/hardware-profiles-nvidia-gpu
  - ../../components/idle-notebook-culling
  - ../../components/rhoai-auth
