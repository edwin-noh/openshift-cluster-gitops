apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: models-as-a-service-db
  annotations:
    # service-ca issues a cert for maas-postgres.models-as-a-service-db.svc(.cluster.local)
    service.beta.openshift.io/serving-cert-secret-name: maas-postgres-tls
spec:
  selector:
    app: maas-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
