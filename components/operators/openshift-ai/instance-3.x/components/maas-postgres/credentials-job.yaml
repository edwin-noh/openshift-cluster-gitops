# The repo is public, so the DB password is generated in-cluster instead of being
# committed. The Secrets are NOT tracked by Argo CD: each is created only if missing and
# survives re-syncs.
#   models-as-a-service-db/maas-postgres-credentials  -> env of the PostgreSQL StatefulSet
#   <ns>/maas-db-config (DB_CONNECTION_URL)           -> read by maas-api
# maas-db-config is written to both redhat-ai-gateway-infra (3.5 MaaS infra namespace per
# the docs) and redhat-ods-applications (where ai-accelerator put it).
# To rotate: delete all three Secrets, re-sync, then restart maas-postgres and maas-api.
# Note: rotating also needs the password changed inside the existing database (or the PVC wiped).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-maas-db-credentials
  namespace: models-as-a-service-db
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-maas-db-credentials
  namespace: models-as-a-service-db
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - maas-postgres-credentials
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-maas-db-credentials
  namespace: models-as-a-service-db
subjects:
  - kind: ServiceAccount
    name: job-maas-db-credentials
    namespace: models-as-a-service-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-maas-db-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-maas-db-credentials
  namespace: redhat-ai-gateway-infra
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - maas-db-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-maas-db-credentials
  namespace: redhat-ai-gateway-infra
subjects:
  - kind: ServiceAccount
    name: job-maas-db-credentials
    namespace: models-as-a-service-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-maas-db-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-maas-db-credentials
  namespace: redhat-ods-applications
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - maas-db-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-maas-db-credentials
  namespace: redhat-ods-applications
subjects:
  - kind: ServiceAccount
    name: job-maas-db-credentials
    namespace: models-as-a-service-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-maas-db-credentials
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-maas-db-credentials
  namespace: models-as-a-service-db
  annotations:
    # Job.spec.template is immutable, so a plain apply of an edited Job fails. Replace alone
    # is not enough either: it PUTs the manifest, which lacks the server-generated
    # spec.selector, and every re-sync fails validation. Force makes it delete+create,
    # so the (idempotent) Job re-runs on each sync.
    # NOTE the RHOAI aggregate's commonAnnotations overwrites this; it is re-applied there.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      containers:
        - name: minion
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              DB_NS=models-as-a-service-db
              rand() { tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$1"; }

              if oc get secret maas-postgres-credentials -n "${DB_NS}" >/dev/null 2>&1; then
                echo "Secret ${DB_NS}/maas-postgres-credentials already exists, leaving it untouched"
              else
                echo "Creating Secret ${DB_NS}/maas-postgres-credentials"
                oc create secret generic maas-postgres-credentials -n "${DB_NS}" \
                  --from-literal=POSTGRESQL_USER=maas \
                  --from-literal=POSTGRESQL_PASSWORD="$(rand 32)" \
                  --from-literal=POSTGRESQL_DATABASE=maas
              fi

              PW=$(oc get secret maas-postgres-credentials -n "${DB_NS}" \
                -o jsonpath='{.data.POSTGRESQL_PASSWORD}' | base64 -d)
              # Server has TLS (service-ca cert); require encryption without CA verification.
              URL="postgresql://maas:${PW}@maas-postgres.${DB_NS}.svc.cluster.local:5432/maas?sslmode=require"

              for ns in redhat-ai-gateway-infra redhat-ods-applications; do
                if oc get secret maas-db-config -n "${ns}" >/dev/null 2>&1; then
                  echo "Secret ${ns}/maas-db-config already exists, leaving it untouched"
                  continue
                fi
                echo "Creating Secret ${ns}/maas-db-config"
                oc create secret generic maas-db-config -n "${ns}" \
                  --from-literal=DB_CONNECTION_URL="${URL}"
              done
      restartPolicy: Never
      serviceAccountName: job-maas-db-credentials
  backoffLimit: 4
