apiVersion: services.platform.opendatahub.io/v1alpha1
kind: Auth
metadata:
  name: auth
spec:
  # kbl-ai-ops / kbl-ai-developers: rhoai-serving-gitops 리포(ops/platform/groups.yaml)가 관리하는 Group.
  # 역할 분리 PoC 동안만 system:authenticated 대신 AI팀 그룹으로 제한한다
  adminGroups:
    - rhods-admins
    - kbl-ai-ops
  allowedGroups:
    - kbl-ai-developers
