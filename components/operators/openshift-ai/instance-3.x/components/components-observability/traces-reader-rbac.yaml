# The RHOAI Tempo runs with multitenancy mode "openshift": reading the
# redhat-ods-monitoring tenant needs `get` on the pseudo-resource below (tenant name as
# resource, "traces" as resourceName). Nothing grants this to humans by default; only
# cluster-admin (wildcard) can see traces. Grant it to the RHOAI admin groups
# (= Auth adminGroups in components/rhoai-auth).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-traces-reader
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - redhat-ods-monitoring
    resourceNames:
      - traces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-traces-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-traces-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-ops
