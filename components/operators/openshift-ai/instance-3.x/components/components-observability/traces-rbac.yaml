# The RHOAI Tempo (data-science-tempomonolithic) runs with multitenancy mode "openshift":
# its gateway authorizes every read/write with a SubjectAccessReview on a pseudo-resource
# (tenant name as resource, "traces" as resourceName) — `create` to write, `get` to read.
# RHOAI 3.5 grants neither, so out of the box:
#  - the data-science-collector's otlp/tempo exporter gets "PermissionDenied: forbidden"
#    and drops every span (collector log: "Exporting failed. Dropping data.")
#  - only cluster-admin (wildcard) can read traces
---
# write: the RHOAI OpenTelemetry collector -> Tempo gateway
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-traces-writer
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - redhat-ods-monitoring
    resourceNames:
      - traces
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-traces-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-traces-writer
subjects:
  - kind: ServiceAccount
    name: data-science-collector-collector
    namespace: redhat-ods-monitoring
---
# read: console Observe -> Traces for the RHOAI admin groups (= Auth adminGroups in
# components/rhoai-auth). Add groups here to widen access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-traces-reader
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - redhat-ods-monitoring
    resourceNames:
      - traces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-traces-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-traces-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-ops
