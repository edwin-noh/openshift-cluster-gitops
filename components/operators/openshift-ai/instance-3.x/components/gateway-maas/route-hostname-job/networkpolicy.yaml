# openshift-ingress has a default-deny NetworkPolicy (openshift-ingress-deny-all, OCP 4.22+),
# so without this the Job pod cannot reach DNS or the API server and times out on
# 172.30.0.1:443. Allow only that pod's egress to DNS and the API (443 = service VIP,
# 6443 = apiserver endpoint after OVN DNAT).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-patch-route-host-allow
  namespace: openshift-ingress
spec:
  podSelector:
    matchLabels:
      app: job-patch-route-host
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
