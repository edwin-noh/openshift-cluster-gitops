apiVersion: dscinitialization.opendatahub.io/v2
kind: DSCInitialization
metadata:
  name: default-dsci
spec:
  applicationsNamespace: redhat-ods-applications
  monitoring:
    # Off in the base. The docs mark metrics.storage.size and .retention as required
    # when monitoring is Managed, and the base has no sane value for them — enabling it
    # here produced a DSCI that was Managed with an empty metrics block. The
    # components-observability component turns it on and supplies the storage spec.
    managementState: Removed
    namespace: redhat-ods-monitoring
  trustedCABundle:
    customCABundle: ''
    managementState: Managed
