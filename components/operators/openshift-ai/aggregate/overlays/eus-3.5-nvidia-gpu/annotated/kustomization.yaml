# Inner layer: stamps the blanket sync-options annotation on every RHOAI object.
# Kept separate from the parent kustomization because kustomize runs commonAnnotations
# AFTER patches, so a patch in the same kustomization would be clobbered. The parent
# re-patches OdhDashboardConfig on top of this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - ../../../../instance-3.x/overlays/eus-3.5-nvidia-gpu
  - ../../../../operator/overlays/eus-3.5
