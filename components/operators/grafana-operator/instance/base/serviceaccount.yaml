# Created here (not left to the operator) so the token Secret and RBAC below always have
# an SA to bind to. grafana-operator v5 adopts the existing "<grafana-name>-sa" SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  annotations:
    # lets the SA act as the OAuth client for oauth-proxy, redirecting back to the Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"grafana-route"}}'
