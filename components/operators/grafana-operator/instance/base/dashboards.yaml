# Dashboard JSON is vendored under dashboards/ (no runtime fetch from grafana.com/GitHub).
#  - vllm.json: vllm-project/vllm examples/observability/prometheus_grafana/grafana.json
#    (queries checked against the RHAIIS vLLM metric names on this cluster)
#  - dcgm.json: NVIDIA DCGM Exporter Dashboard, grafana.com id 12239
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vllm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      instance: grafana
  folder: AI Serving
  configMapRef:
    name: grafana-dashboard-vllm
    key: vllm.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dcgm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      instance: grafana
  folder: AI Serving
  configMapRef:
    name: grafana-dashboard-dcgm
    key: dcgm.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
