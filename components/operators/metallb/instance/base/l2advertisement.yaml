# Layer 2 mode: the node answers ARP for the pool addresses. This is the only mode
# that works on a plain libvirt bridge (BGP would need a peering router).
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
