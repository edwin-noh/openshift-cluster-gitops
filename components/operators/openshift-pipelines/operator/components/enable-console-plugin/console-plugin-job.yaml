---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-tekton-console-plugin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-tekton-console-plugin
rules:
  - apiGroups:
      - operator.openshift.io
    resources:
      - consoles
    verbs:
      - get
      - list
      - patch
      - label
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: job-tekton-console-plugin
subjects:
  - kind: ServiceAccount
    name: job-tekton-console-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-tekton-console-plugin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-tekton-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # Job.spec.template is immutable, so a plain apply of an edited Job fails. Replace alone
    # is not enough either: it PUTs the manifest, which lacks the server-generated
    # spec.selector, and every re-sync fails validation. Force makes it delete+create,
    # so the (idempotent) Job re-runs on each sync.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      containers:
        - name: minion
          image: registry.redhat.io/openshift4/ose-cli
          env:
            - name: PLUGIN_NAME
              value: pipelines-console-plugin
          command:
            - /bin/bash
            - -c
            - /scripts/console-plugin-job.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: job-tekton-console-plugin
            defaultMode: 0755
      restartPolicy: Never
      serviceAccount: job-tekton-console-plugin
      serviceAccountName: job-tekton-console-plugin
  backoffLimit: 4
