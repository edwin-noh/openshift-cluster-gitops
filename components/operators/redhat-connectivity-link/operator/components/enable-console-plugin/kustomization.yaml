apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# No ConsolePlugin here: the RHCL operator creates and owns kuadrant-console-plugin
# itself, so a copy in git stays OutOfSync forever and selfHeal re-syncs in a loop.
# The Job only enables it.
resources:
  - console-plugin-job.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: job-kuadrant-console-plugin
    namespace: kuadrant-system
    files:
      - console-plugin-job.sh
