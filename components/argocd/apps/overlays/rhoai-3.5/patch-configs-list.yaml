- op: replace
  path: /spec/generators/0/list/elements
  value:
    # github-oauth is deliberately NOT enabled on a fresh cluster. Its SealedSecret is
    # sealed against a previous cluster's key, so the controller cannot decrypt it and
    # Secret/openshift-config/github-oauth-secret is never created. OAuth/cluster then
    # references a missing secret and the `authentication` ClusterOperator goes Degraded,
    # breaking console login — a cluster-wide outage, not just a failed Argo app.
    # Before re-enabling: re-seal against this cluster's key, change mappingMethod from
    # `lookup` to `claim` (lookup needs User/Identity objects nothing here creates), and
    # add an `organizations:` restriction.
    - values:
        name: nfs-provisioner
        path: components/cluster-configs/nfs-provisioner/overlays/default
    # S3-compatible object storage for testing (pipelines artifacts, model storage).
    - values:
        name: rustfs
        path: components/cluster-configs/rustfs/overlays/default
    - values:
        name: sealed-secrets
        path: components/cluster-configs/sealed-secrets/overlays/default
    # self-signed-internal-ca is deliberately NOT enabled. Nothing here requests a
    # certificate from its ca-issuer (in ai-accelerator its only consumer was the MaaS
    # Postgres cert, and MaaS is gone), yet it rewrites Proxy/cluster trustedCA, which
    # rolls out a MachineConfig and can reboot the SNO. Re-enable only once something
    # actually needs an internal CA.
    # - values:
    #     name: self-signed-internal-ca
    #     path: components/cluster-configs/self-signed-internal-ca/overlays/default
    - values:
        name: user-workload-monitoring
        path: components/cluster-configs/user-workload-monitoring/overlays/default
