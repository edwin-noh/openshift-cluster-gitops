- op: replace
  path: /spec/generators/0/list/elements
  value:
    # cert-manager is a dependency of the Red Hat build of Kueue and RHOAI KServe,
    # not just of cluster-configs/self-signed-internal-ca (which is disabled).
    - values:
        name: cert-manager-operator
        path: components/operators/cert-manager/operator/overlays/stable-v1
    # CPU-only overcommit (request = limit * 10%) for namespaces labelled
    # clusterresourceoverrides.admission.autoscaling.openshift.io/enabled=true.
    # SNO CPU requests were ~95% with ~6% real usage. Admission webhook only, no reboot.
    - values:
        name: cluster-resource-override-operator
        path: components/operators/cluster-resource-override/aggregate/overlays/default
    - values:
        name: cluster-observability-operator
        path: components/operators/cluster-observability-operator/operator/overlays/stable
    # Red Hat Connectivity Link (Kuadrant: Authorino + Limitador) for RHOAI Models-as-a-Service.
    # The maas overlay also turns on Authorino TLS, which MaaS expects.
    - values:
        name: connectivity-link-operator
        path: components/operators/redhat-connectivity-link/aggregate/overlays/maas
    # Standalone Grafana (oauth-proxy login) for vLLM + DCGM GPU dashboards, reading
    # thanos-querier. Community operator; independent of RHOAI's built-in Perses.
    - values:
        name: grafana-operator
        path: components/operators/grafana-operator/aggregate/overlays/default
    - values:
        name: leader-worker-set-operator
        path: components/operators/leader-worker-set/aggregate/overlays/default
    # MetalLB provides the LoadBalancer Services the RHOAI Gateway API gateways need.
    # Without it the dashboard/inference gateways stay at EXTERNAL-IP <pending> on KVM.
    # - values:
    #     name: metallb-operator
    #     path: components/operators/metallb/aggregate/overlays/default
    - values:
        name: nfd-operator
        path: components/operators/nfd/aggregate/overlays/default
    - values:
        name: nvidia-gpu-operator
        path: components/operators/gpu-operator-certified/aggregate/overlays/default
    - values:
        name: openshift-ai-operator
        path: components/operators/openshift-ai/aggregate/overlays/eus-3.5-nvidia-gpu
    - values:
        name: openshift-custom-metrics-autoscaler-operator
        path: components/operators/openshift-custom-metrics-autoscaler/aggregate/overlays/default
    # Subscription only, NOT aggregate/. The aggregate pulls in instance/overlays/default,
    # which bootstrap/base already applies — two Applications owning the same ArgoCD CR
    # with selfHeal on makes the tracking annotation ping-pong forever.
    - values:
        name: openshift-gitops-operator
        path: components/operators/openshift-gitops/operator/overlays/latest
    - values:
        name: openshift-jobset-operator
        path: components/operators/openshift-jobset/operator/overlays/stable-v1.0
    - values:
        name: openshift-pipelines-operator
        path: components/operators/openshift-pipelines/operator/overlays/latest
    - values:
        name: redhat-build-of-kueue-operator
        path: components/operators/redhat-build-of-kueue/aggregate/overlays/stable-v1.3
    - values:
        name: redhat-build-of-opentelemetry-operator
        path: components/operators/redhat-build-of-opentelemetry/operator/overlays/stable
    - values:
        name: tempo-operator
        path: components/operators/tempo-operator/operator/overlays/stable
    # Removed from the repo entirely, not just from this list:
    #   cloudnative-pg / openshift-external-secrets
    #     - backed ai-accelerator's MaaS Postgres; here MaaS uses the plain
    #       openshift-ai instance-3.x/components/maas-postgres instead
    #   kiali
    #     - RHOAI 3.x has no Service Mesh component; nothing referenced it
