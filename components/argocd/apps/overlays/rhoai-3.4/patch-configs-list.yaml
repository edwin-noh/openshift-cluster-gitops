apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-configs
spec:
  generators:
  - list:
      elements:
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: sealed-secrets
          path: components/cluster-configs/sealed-secrets/overlays/default
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: github-oauth
          path: components/cluster-configs/github-oauth/overlays/default
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: user-workload-monitoring
          path: components/cluster-configs/user-workload-monitoring/overlays/default
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: nfs-provisioner
          path: components/cluster-configs/nfs-provisioner/overlays/default
