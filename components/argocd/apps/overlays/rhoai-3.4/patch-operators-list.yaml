apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-operators
spec:
  generators:
  - list:
      elements:
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: cluster-observability-operator
          path: components/operators/cluster-observability-operator/operator/overlays/stable-1.4.0
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: connectivity-link-operator
          path: components/operators/redhat-connectivity-link/aggregate/overlays/default
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: kiali-operator
          path: components/operators/kiali-operator/operator/overlays/stable
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: leader-worker-set-operator
          path: components/operators/leader-worker-set/operator/overlays/stable-v1.0
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: openshift-ai-operator
          path: components/operators/openshift-ai/aggregate/overlays/stable-3.4
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: openshift-custom-metrics-autoscaler-operator
          path: components/operators/openshift-custom-metrics-autoscaler/operator/overlays/stable
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: openshift-pipelines-operator
          path: components/operators/openshift-pipelines/operator/overlays/latest
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: redhat-build-of-kueue-operator
          path: components/operators/redhat-build-of-kueue/operator/overlays/stable-v1.3
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: redhat-build-of-opentelemetry-operator
          path: components/operators/redhat-build-of-opentelemetry/operator/overlays/stable
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: tempo-operator
          path: components/operators/tempo-operator/operator/overlays/stable
  template:
    spec:
      source:
        targetRevision: main
