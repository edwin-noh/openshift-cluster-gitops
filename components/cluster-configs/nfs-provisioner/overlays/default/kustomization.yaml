apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - anyuid-rolebinding.yaml

namespace: nfs-provisioner

patches:
  - target:
      kind: Deployment
      name: nfs-client-provisioner
    path: patch-nfs-details.yaml
  - target:
      kind: StorageClass
      name: nfs-client
    path: patch-storageclass.yaml