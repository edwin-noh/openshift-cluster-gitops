# SealedSecret placeholder — 실제 배포 전에 kubeseal로 생성 필요
#
# 사용법:
#   1. sealed-secrets 컨트롤러가 클러스터에 배포된 후 공개키 가져오기:
#      kubeseal --fetch-cert --controller-name=sealed-secrets-controller \
#        --controller-namespace=sealed-secrets > pub-cert.pem
#
#   2. GitHub OAuth App에서 Client Secret을 가져와 SealedSecret 생성:
#      oc create secret generic github-oauth-secret \
#        --from-literal=clientSecret=YOUR_GITHUB_CLIENT_SECRET \
#        --namespace=openshift-config --dry-run=client -o yaml \
#        | kubeseal --cert pub-cert.pem --format yaml > github-secret-sealedsecret.yaml
#
#   3. 이 파일을 생성된 내용으로 교체하고 git push
#   4. oauth.yaml의 clientID도 실제 GitHub OAuth App Client ID로 변경
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-oauth-secret
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    clientSecret: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: github-oauth-secret
      namespace: openshift-config
    type: Opaque
