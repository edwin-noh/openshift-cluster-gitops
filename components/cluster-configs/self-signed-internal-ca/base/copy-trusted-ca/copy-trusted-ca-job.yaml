apiVersion: batch/v1
kind: Job
metadata:
  name: job-copy-trusted-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # Job.spec.template is immutable, so a plain apply of an edited Job fails. Replace alone
    # is not enough either: it PUTs the manifest, which lacks the server-generated
    # spec.selector, and every re-sync fails validation. Force makes it delete+create,
    # so the (idempotent) Job re-runs on each sync.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      containers:
        - name: minion
          image: registry.redhat.io/openshift4/ose-cli
          envFrom:
            - configMapRef:
                name: job-copy-trusted-ca-settings
          command:
            - /bin/bash
            - -c
            - /scripts/copy-trusted-ca.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: job-copy-trusted-ca
            defaultMode: 0755
      restartPolicy: Never
      serviceAccount: job-copy-trusted-ca
      serviceAccountName: job-copy-trusted-ca
  backoffLimit: 4
