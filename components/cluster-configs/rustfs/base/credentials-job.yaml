# The repo is public, so the root credentials are generated in-cluster instead of
# being committed. The Secret is NOT tracked by Argo CD: it is created once and
# survives re-syncs. Delete it (and restart the Deployment) to rotate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-rustfs-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-rustfs-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - rustfs-credentials
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-rustfs-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: job-rustfs-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-rustfs-credentials
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-rustfs-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Job.spec.template is immutable, so a plain apply of an edited Job fails. Replace alone
    # is not enough either: it PUTs the manifest, which lacks the server-generated
    # spec.selector, and every re-sync fails validation. Force makes it delete+create,
    # so the (idempotent) Job re-runs on each sync.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  template:
    spec:
      containers:
        - name: minion
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if oc get secret rustfs-credentials >/dev/null 2>&1; then
                echo "Secret rustfs-credentials already exists, leaving it untouched"
                exit 0
              fi
              rand() { tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$1"; }
              echo "Creating Secret rustfs-credentials"
              oc create secret generic rustfs-credentials \
                --from-literal=AWS_ACCESS_KEY_ID="$(rand 20)" \
                --from-literal=AWS_SECRET_ACCESS_KEY="$(rand 40)"
      restartPolicy: Never
      serviceAccountName: job-rustfs-credentials
  backoffLimit: 4
