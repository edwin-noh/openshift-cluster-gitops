apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rustfs-api
  annotations:
    # The router's 30s default cuts off large multipart uploads.
    haproxy.router.openshift.io/timeout: 10m
spec:
  to:
    kind: Service
    name: rustfs
  port:
    targetPort: s3
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rustfs-console
spec:
  to:
    kind: Service
    name: rustfs
  port:
    targetPort: console
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
