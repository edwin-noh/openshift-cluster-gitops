---
- name: SNO 클러스터 가상머신 삭제 및 설치 파일 정리
  hosts: hypervisors
  become: yes
  vars_files:
    - vars/main.yml

  tasks:
    - name: 가상머신 존재 여부 확인
      command: virsh domstate {{ sno_vm_name }}
      register: vm_state
      failed_when: false
      changed_when: false

    - name: 실행 중인 가상머신 강제 중지
      command: virsh destroy {{ sno_vm_name }}
      when: vm_state.rc == 0 and vm_state.stdout is search("running")

    - name: 가상머신 정의 및 스토리지 삭제
      command: virsh undefine {{ sno_vm_name }} --remove-all-storage
      when: vm_state.rc == 0

    - name: SNO 설치 디렉토리 정리 (/root/sno-install)
      file:
        path: /root/sno-install
        state: absent

    - name: 결과
      debug:
        msg: "가상머신 '{{ sno_vm_name }}' 및 설치 파일이 삭제되었습니다."
