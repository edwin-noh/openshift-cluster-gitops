---
# 1. KVM 관련 필수 패키지 설치
- name: KVM 및 가상화 관련 필수 패키지 설치
  dnf:
    name:
      - qemu-kvm
      - libvirt
      - libvirt-client
      - virt-install
      - libguestfs-tools
    state: present
  tags: kvm_install

# 2. libvirtd 서비스 기동 및 활성화
- name: libvirtd 서비스 기동 및 부팅 시 자동 시작 설정
  systemd:
    name: libvirtd
    state: started
    enabled: yes
  tags: kvm_service

# 3. Storage Pool 생성 및 기동 (200GB 볼륨이 위치할 풀)
- name: 스토리지 풀 경로 디렉토리 생성
  file:
    path: "{{ kvm_storage_pool_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: libvirt 스토리지 풀 존재 여부 확인
  command: virsh pool-info {{ kvm_storage_pool_name }}
  register: pool_check
  failed_when: false
  changed_when: false
  tags: kvm_storage

- name: libvirt 스토리지 풀 정의
  shell: |
    virsh pool-define-as {{ kvm_storage_pool_name }} dir --target {{ kvm_storage_pool_path }}
  when: pool_check.rc != 0
  tags: kvm_storage

- name: libvirt 스토리지 풀 활성화
  command: virsh pool-start {{ kvm_storage_pool_name }}
  when: pool_check.rc != 0
  tags: kvm_storage

- name: libvirt 스토리지 풀 자동 시작 설정
  command: virsh pool-autostart {{ kvm_storage_pool_name }}
  when: pool_check.rc != 0
  tags: kvm_storage

# 4. SNO 설치 가상 디스크는 openshift_sno 역할의 virt-install 단계에서
#    --disk ...,size=...,format=qcow2 로 생성/소유한다. (재설치 시 undefine --remove-all-storage
#    로 함께 삭제되므로 여기서 미리 만들면 "already exists" 충돌이 발생한다.)
#    따라서 스토리지 풀 디렉토리만 준비하면 충분하다.

