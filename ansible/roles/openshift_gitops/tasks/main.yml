---
# 이 역할은 로컬 Mac에서 실행됨 (connection: local)
# ansible-admin ServiceAccount kubeconfig를 사용하여 원격 클러스터에 접근

# 1. OpenShift GitOps Operator 설치
- name: GitOps Operator 설치 여부 확인
  shell: "oc get csv -n openshift-gitops-operator -o jsonpath='{.items[0].status.phase}'"
  environment:
    KUBECONFIG: "{{ gitops_kubeconfig }}"
  register: gitops_csv_check
  failed_when: false
  changed_when: false
  tags: gitops_install

- name: GitOps Operator Kustomize 매니페스트 배포
  shell: "kustomize build {{ playbook_dir }}/../components/operators/openshift-gitops/operator/overlays/latest | oc apply -f -"
  environment:
    KUBECONFIG: "{{ gitops_kubeconfig }}"
  when: gitops_csv_check.stdout != "Succeeded"
  tags: gitops_install

- name: GitOps CSV(ClusterServiceVersion) Succeeded 될 때까지 대기
  shell: "oc get csv -n openshift-gitops-operator -o jsonpath='{.items[0].status.phase}'"
  environment:
    KUBECONFIG: "{{ gitops_kubeconfig }}"
  register: csv_phase
  until: csv_phase.stdout == "Succeeded"
  retries: 40
  delay: 15
  changed_when: false
  failed_when: false
  when: gitops_csv_check.stdout != "Succeeded"
  tags: gitops_wait

- name: GitOps Operator 설치 검증
  assert:
    that: (gitops_csv_check.stdout == "Succeeded") or (csv_phase.stdout == "Succeeded")
    fail_msg: "OpenShift GitOps Operator CSV가 Succeeded 가 아닙니다. operator 설치 실패."
  tags: gitops_wait

# 2. Argo CD 인스턴스 준비 및 기동 대기
- name: Argo CD 서버 Pod 기동 완료 대기
  shell: "oc get pods -l app.kubernetes.io/name=openshift-gitops-server -n openshift-gitops -o jsonpath='{.items[0].status.phase}'"
  environment:
    KUBECONFIG: "{{ gitops_kubeconfig }}"
  register: pod_phase
  until: pod_phase.stdout == "Running"
  retries: 40
  delay: 15
  changed_when: false
  failed_when: false
  tags: gitops_wait

- name: Argo CD 서버 Pod 기동 검증
  assert:
    that: pod_phase.stdout == "Running"
    fail_msg: "Argo CD 서버 Pod가 Running 이 아닙니다 (현재: '{{ pod_phase.stdout }}'). ArgoCD 인스턴스 기동 실패."
  tags: gitops_wait

# 3. GitHub OAuth 설정을 Git 저장소에 반영 후 Push
- name: SealedSecret 파일 존재 여부 확인
  stat:
    path: "{{ playbook_dir }}/.tmp/github-oauth-sealedsecret.yaml"
  register: sealed_secret_file
  tags: gitops_bootstrap

- name: SealedSecret 매니페스트를 Git 저장소에 복사
  copy:
    src: "{{ playbook_dir }}/.tmp/github-oauth-sealedsecret.yaml"
    dest: "{{ playbook_dir }}/../components/cluster-configs/github-oauth/base/github-secret-sealedsecret.yaml"
  when: sealed_secret_file.stat.exists
  tags: gitops_bootstrap

- name: OAuth CR에 GitHub Client ID 설정
  replace:
    path: "{{ playbook_dir }}/../components/cluster-configs/github-oauth/base/oauth.yaml"
    regexp: 'clientID: .*'
    replace: "clientID: {{ github_oauth_client_id }}"
  when: sealed_secret_file.stat.exists and github_oauth_client_id != "CHANGE_ME"
  tags: gitops_bootstrap

- name: GitHub OAuth 변경사항 Git Commit & Push
  shell: |
    cd {{ playbook_dir }}/..
    git add components/cluster-configs/github-oauth/
    if git diff --cached --quiet; then
      echo "No changes to commit"
    else
      git commit -m "chore: update GitHub OAuth sealed secret and client ID"
      git push origin {{ gitops_repo_branch }}
    fi
  register: git_push_result
  when: sealed_secret_file.stat.exists
  tags: gitops_bootstrap

- name: 임시 SealedSecret 파일 정리
  file:
    path: "{{ playbook_dir }}/.tmp/github-oauth-sealedsecret.yaml"
    state: absent
  when: sealed_secret_file.stat.exists
  tags: gitops_bootstrap

# 4. Bootstrap Application 등록
- name: Bootstrap Application 템플릿 렌더링
  template:
    src: bootstrap-app.yaml.j2
    dest: "/tmp/bootstrap-app.yaml"
    mode: '0600'
  tags: gitops_bootstrap

- name: Argo CD에 Bootstrap Application 등록 (GitOps 부트스트래핑 시작)
  shell: "oc apply -f /tmp/bootstrap-app.yaml"
  environment:
    KUBECONFIG: "{{ gitops_kubeconfig }}"
  tags: gitops_bootstrap

- name: 임시 Bootstrap Application 파일 정리
  file:
    path: "/tmp/bootstrap-app.yaml"
    state: absent
  tags: gitops_bootstrap

