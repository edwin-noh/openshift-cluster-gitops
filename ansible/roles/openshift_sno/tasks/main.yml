# 5. OpenShift 설치 완료 대기
- name: OpenShift SNO 설치 완료 대기 (최대 40~50분 소요 가능)
  command: "/root/sno-install/openshift-install agent wait-for install-complete --dir=/root/sno-install --log-level=info"
  async: 3600  # 1시간 대기 제한
  poll: 30
  tags: sno_wait

