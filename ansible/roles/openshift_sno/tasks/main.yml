---
# 1. OpenShift CLI 및 Installer 도구 다운로드
- name: SNO 설치 디렉토리 생성
  file:
    path: "/root/sno-install"
    state: directory
    mode: '0755'
  tags: sno_prepare

#기본적으로 rhel9용으로 다운로드 됨                  
- name: OpenShift 클라이언트(oc) 다운로드 및 압축 해제
  unarchive:
    src: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ openshift_release_channel }}/openshift-client-linux-amd64-rhel8-4.22.6.tar.gz"
    dest: "/usr/local/bin"
    remote_src: yes
    exclude:
      - README.md
  tags: sno_prepa

- name: OpenShift Installer 다운로드 및 압축 해제
  unarchive:
    src: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ openshift_release_channel }}/openshift-install-linux.tar.gz"
    dest: "/root/sno-install"
    remote_src: yes
  tags: sno_prepare

# 2. OpenShift 설정 템플릿 생성
- name: install-config.yaml 파일 생성
  template:
    src: install-config.yaml.j2
    dest: "/root/sno-install/install-config.yaml"
    mode: '0600'
  tags: sno_config

- name: agent-config.yaml 파일 생성
  template:
    src: agent-config.yaml.j2
    dest: "/root/sno-install/agent-config.yaml"
    mode: '0600'
  tags: sno_config

# 3. Agent-based Installer ISO 생성
- name: qemu 사용자가 ISO에 접근할 수 있도록 /root 디렉토리 권한 설정
  file:
    path: /root
    mode: '0711'
  tags: sno_image

- name: Agent 설치 부팅 ISO 이미지 생성 여부 확인
  stat:
    path: "/root/sno-install/agent.x86_64.iso"
  register: iso_stat
  tags: sno_image

- name: Agent-based Installer 부팅 ISO 이미지 생성
  command: "/root/sno-install/openshift-install agent create image --dir=/root/sno-install"
  when: not iso_stat.stat.exists
  tags: sno_image

# 4. KVM 가상머신(SNO) 기동
- name: 기존 가상머신 기동 여부 확인
  shell: "virsh domstate {{ sno_vm_name }}"
  register: vm_check
  failed_when: false
  changed_when: false
  tags: sno_provision

- name: 기존 가상머신이 존재할 경우 삭제 (재설치 프로세스 보장)
  shell: |
    virsh destroy {{ sno_vm_name }}
    virsh undefine {{ sno_vm_name }} --remove-all-storage
  when: vm_check.rc == 0
  tags: sno_provision
  ignore_errors: yes

- name: SNO 가상머신(virt-install) 설치 및 기동
  # Agent ISO는 cdrom 디바이스로 연결한다(--location 은 네트워크 설치 트리용이라 ISO 부팅 불가).
  # --boot hd,cdrom: 빈 디스크는 첫 부팅에서 cdrom(설치 ISO)으로 떨어지고, 설치 후 디스크가
  # 부팅 가능해지면 hd로 부팅된다(ISO 재부팅 루프 방지). 디스크는 virt-install이 생성/소유한다.
  shell: |
    virt-install \
      --name={{ sno_vm_name }} \
      --vcpus={{ sno_vcpu }} \
      --memory={{ sno_memory_mb }} \
      --disk pool={{ kvm_storage_pool_name }},size={{ kvm_sno_vol_size | regex_replace('[Gg]$','') }},format=qcow2,bus=virtio \
      --disk path=/root/sno-install/agent.x86_64.iso,device=cdrom \
      --network bridge={{ kvm_bridge_interface }},model=virtio,mac={{ sno_mac_address }} \
      --boot hd,cdrom,menu=on \
      --graphics none \
      --noautoconsole \
      --os-variant=rhel9.0
  tags: sno_provision

