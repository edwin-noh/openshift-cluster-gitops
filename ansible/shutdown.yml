---
- name: SNO 클러스터 가상머신 종료
  hosts: hypervisors
  become: yes
  vars_files:
    - vars/main.yml

  tasks:
    - name: 가상머신 실행 상태 확인
      command: virsh domstate {{ sno_vm_name }}
      register: vm_state
      failed_when: false
      changed_when: false

    - name: 가상머신이 존재하지 않음
      fail:
        msg: "가상머신 '{{ sno_vm_name }}'이 존재하지 않습니다."
      when: vm_state.rc != 0

    - name: 가상머신 graceful 종료 (ACPI shutdown)
      command: virsh shutdown {{ sno_vm_name }}
      when: vm_state.stdout is search("running")

    - name: 가상머신 종료 완료 대기 (최대 5분)
      shell: virsh domstate {{ sno_vm_name }}
      register: shutdown_state
      until: shutdown_state.stdout is search("shut off")
      retries: 30
      delay: 10
      changed_when: false
      when: vm_state.stdout is search("running")

    - name: 현재 가상머신 상태 출력
      command: virsh domstate {{ sno_vm_name }}
      register: final_state
      changed_when: false

    - name: 결과
      debug:
        msg: "{{ sno_vm_name }} 상태: {{ final_state.stdout }}"
