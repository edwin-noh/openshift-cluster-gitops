---
# 1단계: 하이퍼바이저에서 KVM 설정 및 OpenShift SNO 설치
- name: "RHEL8 KVM 기반 OpenShift SNO 구축 (하이퍼바이저)"
  hosts: hypervisors
  become: yes
  vars_files:
    - vars/main.yml
    - vars/vault.yml

  roles:
    - role: kvm_setup
      tags: kvm

    - role: openshift_sno
      tags: sno

# 2단계: 로컬 Mac에서 ansible-admin SA로 GitOps 부트스트래핑
- name: "OpenShift GitOps 부트스트랩 (로컬 실행)"
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - vars/main.yml
  vars:
    gitops_kubeconfig: "{{ playbook_dir }}/.kubeconfig/ansible-admin.kubeconfig"

  roles:
    - role: openshift_gitops
      tags: gitops
