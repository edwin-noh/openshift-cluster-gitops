apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../../base
  - ../../../components/argocd/apps/overlays/rhoai-3.4



configMapGenerator:
  - name: gitops-repo-config
    literals:
      - repoURL=https://github.com/edwin-noh/openshift-cluster-gitops.git
      - targetRevision=main

replacements:
  # copy the repo from the application to the applicationsets
  - source:
      kind: Application
      fieldPath: spec.source.repoURL
    targets:
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.template.spec.source.repoURL
  # copy the branch from the application to the applicationsets
  - source:
      kind: Application
      fieldPath: spec.source.targetRevision
    targets:
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.template.spec.source.targetRevision

