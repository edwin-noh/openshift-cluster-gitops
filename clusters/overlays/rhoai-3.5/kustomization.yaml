apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../../base
  - ../../../components/argocd/apps/overlays/rhoai-3.5

replacements:
  - source:
      kind: Application
      name: cluster-config-app-of-apps
      fieldPath: spec.source.repoURL
    targets:
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.template.spec.source.repoURL
  - source:
      kind: Application
      name: cluster-config-app-of-apps
      fieldPath: spec.source.targetRevision
    targets:
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.template.spec.source.targetRevision
